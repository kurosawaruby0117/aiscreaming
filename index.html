<!DOCTYPE html>
<html lang="ko">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AiScream!</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    .info-box {
      background-color: rgba(255, 255, 255, 0.85);
      border-radius: 12px;
      padding: 16px 24px;
      margin: 20px auto;
      max-width: 360px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      color: #333;
      text-align: left;
      line-height: 1.6;
    }

    .info-box b {
      color: #d14d72;
    }

    .info-box a {
      color: #3773e0;
      text-decoration: none;
      font-weight: bold;
    }

    .info-box a:hover {
      text-decoration: underline;
    }

<body class="main-bg">
  <div class="main-container">
    <h1 class="main-title"><span class="ice">Ai</span><span class="scream">Scream!</span></h1>


    <div class="info-box">
      <div><b>学籍番号:</b> 8724506</div>

      <div><b>最終提出日:</b> 2025년 5월 4일</div>
      <div><a href="https://www.tufs.ac.jp/" target="_blank">東京外大ウェブページ</a></div>
      <div＞<b>このゲームはラブライブ！シリーズの”AiScream!"</b></b>という曲とイラストを利用して作られたファンゲームです。一切収益化しておりません。</b＞</div>
    </div>

    <div class="main-buttons">
      <button onclick="location.href='game-info.html'">ルール案内</button>
      <button onclick="location.href='game.html'">ゲームスタート</button>
      <button onclick="location.href='links.html'">関連サイト</button>

    </div>
  </div>

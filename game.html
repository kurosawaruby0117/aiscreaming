
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>AiScream! - Game</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700&display=swap" rel="stylesheet">

</head>
<body>
  <audio id="bgm" src="assets/bgm.mp3"></audio>
  <div class="score-combo-ui">
    <div class="ui-item">
      <span class="value" id="score">🍨 SCORE 0</span>
    </div>
    <div class="ui-item">
      <span class="value" id="combo">💫 COMBO 0</span>
    </div>
  </div>
  

  <button id="pauseBtn" class="pause-btn">⏸</button>


<!-- 캐릭터 하얀 배경 -->
<div class="character-panel">
  <img id="character" src="assets/ruby.png" alt="캐릭터" class="character-img" />
  <div id="characterName" class="character-name">루비</div>
</div>

<!-- 🔻 게이지는 아래로 이동 -->
<div class="character-gauge">
  <div class="gauge-fill" id="gaugeFill"></div>
</div>
<div class="fever-gauge" style="display: none;">
  <div class="fever-gauge-fill" id="feverGaugeFill"></div>
</div>

<!-- 아이스크림 하얀 배경 -->
<div class="grid-wrapper">
  <div class="grid"></div>
</div>

  <div id="pauseModal" class="modal hidden">
    <div class="modal-content">
      <h2>⏸ PAUSE</h2>
      <button id="resumeBtn">▶ RESUME</button>
      <button onclick="location.href='index.html'">🏠 GO MAIN</button>
    </div>
  </div>
  <div id="startModal" class="modal">
    <div class="modal-content">
      <h2>🍦 キャラクターが好きなアイスクリーム！</h2>
      <div class="match-guide">
        <div class="guide-item">
          <img src="assets/ruby.png" alt="ルビィ" class="guide-char" />
          <span>→</span>
          <img src="assets/ice_ruby.png" alt="ミント" class="guide-ice" />
        </div>
        <div class="guide-item">
          <img src="assets/ayumu.png" alt="アユム" class="guide-char" />
          <span>→</span>
          <img src="assets/ice_ayumu.png" alt="イチゴ" class="guide-ice" />
        </div>
        <div class="guide-item">
          <img src="assets/wakanashiki.png" alt="シキ" class="guide-char" />
          <span>→</span>
          <img src="assets/ice_shiki.png" alt="クッキー＆クリーム" class="guide-ice" />
        </div>
      </div>
      
      <!-- 음량 안내 문구 추가 -->
      <p style="color: #ff4d88; font-weight: bold; margin-top: 1rem;">🎧 音量にご注意ください！</p>
      
      <button id="startGameBtn">GAME START!</button>
    </div>
  </div>
  
  <div id="resultModal" class="modal hidden">
    <div class="modal-content">
      <h2>🎉 GAME END</h2>
      <p id="finalScore">SCORE: 0</p>
      <p id="finalCombo">MOST COMBO: 0</p>
      <button onclick="location.reload()">🔁 RETRY</button>
      <button onclick="location.href='index.html'">🏠 MAIN PAGE</button>
    </div>
  </div>
  
  
  <script src="script.js"></script>
</body>
</html>
